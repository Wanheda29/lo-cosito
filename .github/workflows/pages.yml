name: Publicar demo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar demo con almacenamiento local
        run: |
          mkdir -p dist
          cp app.js cloud.js combos.js domain.js manifest.webmanifest pdf-export.js storage.js styles.css sw.js dist/
          cp -R assets vendor dist/
          sed 's/Comida vegana y vegetariana/Demo pública · Usá datos ficticios/' index.html > dist/index.html
          sed -i 's/"lo-cosito-v1"/"lo-cosito-demo-v1"/' dist/storage.js
          cat > dist/cloud-config.js <<'EOF'
          export const cloudConfig = { enabled: false, url: "", publishableKey: "" };
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
