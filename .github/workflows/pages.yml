name: Publicar Lo Cosito en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar sitio con acceso por Supabase
        run: |
          mkdir -p dist
          cp index.html app.js cloud-config.js cloud.js combos.js domain.js manifest.webmanifest pdf-export.js storage.js styles.css sw.js dist/
          cp -R assets vendor dist/
          node --input-type=module -e 'import { isCloudConfigured } from "./dist/cloud.js"; if (!isCloudConfigured()) throw new Error("Supabase debe estar habilitado para publicar");'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
